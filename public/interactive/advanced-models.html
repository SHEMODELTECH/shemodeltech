<style>
:root{
  --bg:#ffffff; --surface:#f2f5f6; --surface2:#e6ecee; --ink:#26292b; --muted:#5d666a; --line:#d5dde0;
  --orange:#ef7d1a; --red:#d4461b; --teal:#128f8f; --teal-soft:#d7efee; --maroon:#7a1d36; --good:#1c8a4a; --bad:#c0392b;
  --display:"Bricolage Grotesque", "Segoe UI", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  --mono:"JetBrains Mono", "Courier New", monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1516; --surface:#182224; --surface2:#223033; --ink:#e7eced; --muted:#9fb0b4; --line:#2e3e41;
    --orange:#f5943f; --red:#ff7a4f; --teal:#3cc2c0; --teal-soft:#153b3b; --maroon:#e8829c; --good:#4cc47f; --bad:#ff6b5b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1516; --surface:#182224; --surface2:#223033; --ink:#e7eced; --muted:#9fb0b4; --line:#2e3e41;
  --orange:#f5943f; --red:#ff7a4f; --teal:#3cc2c0; --teal-soft:#153b3b; --maroon:#e8829c; --good:#4cc47f; --bad:#ff6b5b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 30px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:0 8px 4px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35}
.part{font-size:13px;color:var(--muted);margin:20px 8px 6px;font-weight:600}
.mod{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer;line-height:1.3;font-size:15px}
.mod:hover{background:var(--surface2)}
.mod[aria-current="true"]{background:var(--ink);color:var(--bg)}
.mod[aria-current="true"] .px{background:var(--orange);color:#1b1b1b}
.px{flex:0 0 26px;height:26px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface2);border-radius:4px}
.mod.done .px{background:var(--teal);color:#fff}
.railfoot{margin:22px 8px 0;font-size:13px;color:var(--muted)}
.themebtn{margin-top:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
/* main */
main{padding:34px clamp(18px,4vw,56px) 80px;min-width:0}
.mobilenav{display:none}
.eyebrow{font-size:15px;color:var(--teal);font-weight:600;margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.4vw,52px);line-height:1.04;margin:4px 0 12px;letter-spacing:-.01em;max-width:18ch}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 10px;line-height:1.2}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 8px}
.bigidea{font-size:21px;max-width:60ch;margin:0 0 18px;color:var(--ink)}
.decks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}

.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:start}
.card{background:var(--surface);border-radius:14px;padding:22px}
.lab{background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:20px;min-width:0}
.lab h2::before{content:"";display:inline-block;width:12px;height:12px;background:var(--orange);margin-right:10px;border-radius:2px;vertical-align:2px}
.points{margin:0;padding:0;list-style:none;counter-reset:p}
.points li{counter-increment:p;padding:10px 0 10px 38px;position:relative;border-top:1px solid var(--line)}
.points li:first-child{border-top:0}
.points li::before{content:counter(p);position:absolute;left:0;top:10px;width:26px;height:26px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--teal);color:#fff;border-radius:4px}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--teal)}
details p{margin:10px 0 0}
.below{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.why{margin-top:10px;font-size:15px;color:var(--muted)}
.fixes{margin:0;padding-left:20px;font-size:15.5px}

.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:34px}

.ctrls{display:flex;flex-wrap:wrap;gap:12px 18px;margin:12px 0;align-items:center}
.ctrl{display:flex;flex-direction:column;font-size:14px;color:var(--muted);min-width:130px;flex:1 1 130px}
.ctrl b{color:var(--ink);font-family:var(--mono);font-weight:600}
input[type=range]{accent-color:var(--orange);width:100%}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;cursor:pointer;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
canvas{display:block;max-width:100%;image-rendering:pixelated;border-radius:8px;background:#000}
.cv-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.cv-row figure{margin:0;flex:1 1 200px;min-width:0}
figcaption{font-size:13.5px;color:var(--muted);margin-top:4px}
.matrix{font-family:var(--mono);font-size:13px;border-collapse:collapse}
.matrix td{border:1px solid var(--line);padding:3px 6px;text-align:right;min-width:34px}
.note{font-size:14.5px;color:var(--muted);margin:8px 0 0}
.stat{display:inline-block;margin:4px 14px 4px 0;font-size:15px}
.stat b{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1b1b1b}
pre.code{background:var(--surface);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;overflow-x:auto;margin:10px 0 0;line-height:1.5}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.scroll{overflow-x:auto}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}
.flow div{background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.3}
.flow b{display:block;font-family:var(--mono);color:var(--teal);font-size:12px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}
.map button{text-align:left;background:var(--surface);border:0;border-radius:12px;padding:14px;cursor:pointer;line-height:1.3}
.map button:hover{background:var(--surface2)}
.map .px{display:inline-grid;margin-bottom:8px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center}
.lensgrid{font-family:var(--mono);font-size:11px;border-collapse:collapse}

  .app{grid-template-columns:1fr}

<script>
const COURSE={title:"Advanced Models",tag:"From clusters to transformers — learn by doing",key:"advstu",headline:"See how modern AI models work — then try them yourself",intro:"Each module explains one family of models in plain language, with worked examples, a hands-on lab you can play with, and a short quiz to check yourself.",hero:{demo:"vit",title:"Try it: an image as a transformer sees it",sub:"Pick a patch size, then click a patch."}};
const PARTS=["Learning without labels","Seeing with deep models","Generating with deep models"];
const MODULES=[
{n:1,part:0,title:"Unsupervised Learning: Clustering & Association Rules",short:"Clustering & rules",slides:"Slides 1.1 Clustering · 1.2 Association Rules",demo:"kmeans",mins:35,
 goals:["Explain what makes learning \u201cunsupervised\u201d","Run the K-means algorithm step by step","Compare the main families of clustering methods","Score an association rule with support, confidence and lift"],
 sections:[
 {h:"Learning without answers",b:`<p>In <b>supervised</b> learning every example comes with the right answer (a label) — \u201cthis photo is a cat\u201d. In <b>unsupervised</b> learning there are no labels. The model only sees the data and has to discover structure by itself.</p>
 <div class="tip"><b>Think of it like this:</b> you are handed a box of 500 mixed buttons and nobody tells you the categories. You would naturally sort them by colour, size or number of holes. That sorting is clustering.</div>
 <p>Two common unsupervised jobs: <b>clustering</b> (group similar items) and <b>finding associations</b> (which things tend to happen together). Dimensionality reduction, in Module 2, is a third.</p>`},
 {h:"What clustering does",b:`<p><b>Clustering</b> groups data points so that points in the same group (a <i>cluster</i>) are more similar to each other than to points in other groups. \u201cSimilar\u201d usually means \u201cclose together\u201d when we plot the features.</p>
 <table class="tbl"><tr><th>Hard clustering</th><th>Soft clustering</th></tr><tr><td>Each point belongs to exactly <b>one</b> cluster.</td><td>Each point gets a <b>probability</b> for every cluster.</td></tr><tr><td>Example: K-means says \u201cthis customer is in group 2.\u201d</td><td>Example: a Gaussian mixture says \u201c70% group 2, 30% group 3.\u201d</td></tr></table>
 <p>Where it is used: customer segmentation, grouping similar images, spotting unusual behaviour (points that fit no cluster), organising documents, and segmenting an image into regions.</p>`},
 {h:"K-means, step by step",b:`<p>K-means is the most popular clustering method. You choose <b>k</b>, the number of clusters, and it finds k centre points called <b>centroids</b>.</p>
 <ol class="steps"><li><b>Start:</b> pick k starting centroids (often k random data points).</li><li><b>Assign:</b> give every point to its nearest centroid.</li><li><b>Update:</b> move each centroid to the average (mean) position of the points assigned to it.</li><li><b>Repeat</b> steps 2–3 until no point changes cluster. That is called <i>convergence</i>.</li></ol>
 <div class="eq">Goal: make the within-cluster sum of squared distances (SSE) as small as possible</div>
 <p><b>Watch out:</b> K-means can get stuck in a poor answer depending on where it starts, so people run it several times. It also expects roughly round, similar-sized clusters, and you must choose k yourself — a common trick is the <b>elbow method</b>: plot SSE for k = 1, 2, 3… and pick the k where the curve stops dropping sharply.</p>`,lab:true},
 {h:"Other ways to cluster",b:`<table class="tbl"><tr><th>Family</th><th>Idea</th><th>Examples</th><th>Good for</th></tr>
 <tr><td>Centroid-based</td><td>Each cluster has a centre point</td><td>K-means, K-medoids</td><td>Fast, simple, round clusters</td></tr>
 <tr><td>Density-based</td><td>Clusters are crowded areas separated by empty space</td><td>DBSCAN, OPTICS</td><td>Odd shapes; labels lonely points as noise</td></tr>
 <tr><td>Connectivity (hierarchical)</td><td>Build a tree by merging (agglomerative) or splitting (divisive) groups</td><td>Agglomerative clustering</td><td>Seeing clusters at many levels (a dendrogram)</td></tr>
 <tr><td>Distribution-based</td><td>Data comes from a mix of probability distributions</td><td>Gaussian Mixture Model (GMM)</td><td>Soft, oval-shaped clusters</td></tr>
 <tr><td>Fuzzy</td><td>Points belong partly to several clusters</td><td>Fuzzy C-Means</td><td>Overlapping groups</td></tr></table>
 <p><b>Don\u2019t mix these up:</b> K-means (clustering, unsupervised) is not K-nearest-neighbours (classification, supervised). Both use \u201cK\u201d and distances, but KNN needs labels.</p>`},
 {h:"Association rules",b:`<p>Association rules find items that appear together, written <b>X → Y</b> (\u201cif X, then often Y\u201d). They come from <b>market-basket analysis</b>: which products do shoppers buy together?</p>
 <div class="eq">Support(X→Y) = baskets with X and Y ÷ all baskets<br>Confidence(X→Y) = baskets with X and Y ÷ baskets with X<br>Lift(X→Y) = Confidence ÷ (baskets with Y ÷ all baskets)</div>
 <div class="ex"><b>Worked example.</b> 10 baskets. Bread is in 5, butter in 3, and both appear together in 3.<br>Support = 3/10 = 0.30 · Confidence = 3/5 = 0.60 · Lift = 0.60 ÷ 0.30 = <b>2.0</b><br>Lift above 1 means buying bread really does make butter more likely.</div>
 <p>Why lift matters: if almost everyone buys milk, then \u201cbread → milk\u201d will have high confidence even if bread has nothing to do with it. Lift corrects for how common Y already is. <b>Lift &gt; 1</b> = positive link, <b>= 1</b> = no link, <b>&lt; 1</b> = negative link. Try the rule calculator in the lab.</p>`}],
 terms:[["Unsupervised learning","Learning patterns from data that has no labels."],["Cluster","A group of data points that are similar to each other."],["Centroid","The centre point of a cluster (the mean of its points)."],["Convergence","When repeating the algorithm no longer changes the result."],["Support / Confidence / Lift","How often a rule occurs / how reliable it is / whether the link is real."]],
 quiz:[{q:"What does K-means do in the \u201cupdate\u201d step?",o:["Adds new data points","Moves each centroid to the mean of its assigned points","Changes the value of k","Removes outliers"],a:1,why:"Update = recompute centroids as averages. Assign = give each point to its nearest centroid."},
 {q:"Which method can find oddly shaped clusters and mark lonely points as noise?",o:["K-means","DBSCAN","Linear regression","Fuzzy C-Means"],a:1,why:"DBSCAN is density-based: clusters are crowded regions, and isolated points are labelled noise."},
 {q:"A rule has confidence 0.8 but lift 0.9. What does that tell you?",o:["A strong positive link","Y is so common that X doesn\u2019t actually raise its chance","The rule is impossible","Support must be 0"],a:1,why:"Lift below 1 means Y is slightly less likely with X than it is overall, despite the high confidence."},
 {q:"Which one is NOT unsupervised?",o:["K-means","Hierarchical clustering","K-nearest neighbours classification","Association rules"],a:2,why:"KNN classification needs labelled examples, so it is supervised."}],
 recap:["No labels: the model discovers structure itself.","K-means = assign, update, repeat. You pick k; restarts help.","Different cluster shapes need different methods (DBSCAN for odd shapes, GMM for soft oval clusters).","Rules X → Y are judged by support, confidence and especially lift."]},

{n:2,part:0,title:"Dimensionality Reduction & PCA",short:"Dimensionality reduction",slides:"Slides 2.1 Dimensionality Reduction & PCA",demo:"pca",mins:35,
 goals:["Say why having too many features is a problem","Tell feature selection apart from feature extraction","Follow the four steps of PCA","Read explained variance to choose how many components to keep"],
 sections:[
 {h:"Why reduce dimensions?",b:`<p>Each <b>feature</b> is one measurement about an example (a pixel value, a person\u2019s age…). A dataset with many features is <b>high-dimensional</b>. A small 64×64 grayscale image already has 4,096 features.</p>
 <p>Too many features cause trouble: training is slower, the data is hard to visualise, and models can <b>overfit</b> (memorise noise) because there is so much room to find accidental patterns. This is sometimes called the <i>curse of dimensionality</i>.</p>
 <div class="tip"><b>Think of it like this:</b> a 3D object casts a 2D shadow. If you hold it at the right angle, the shadow still shows you most of its shape. Dimensionality reduction looks for the \u201cbest angle\u201d.</div>
 <table class="tbl"><tr><th>Advantages</th><th>Disadvantages</th></tr><tr><td>Faster training with fewer features</td><td>Some information is lost</td></tr><tr><td>Easier to plot and understand</td><td>Choosing how many dimensions to keep can be hard</td></tr><tr><td>Less overfitting</td><td>Reducing too far hurts accuracy</td></tr></table>`},
 {h:"Two approaches",b:`<p><b>Feature selection</b> keeps some of the original features and throws the rest away. Ways to choose:</p>
 <ul><li><b>Filter methods</b> score each feature on its own — e.g. drop features with many missing values (missing value ratio), almost no variation (low variance), or that copy another feature (high correlation).</li><li><b>Wrapper methods</b> try different subsets with a model — e.g. forward selection (add one at a time) or backward elimination (remove one at a time).</li><li><b>Embedded methods</b> let the model decide while training — e.g. random forest feature importance.</li></ul>
 <p><b>Feature extraction</b> builds <i>new</i> features by combining the old ones. PCA is the classic example. The new features are compact but harder to interpret.</p>`},
 {h:"PCA in four steps",b:`<p><b>Principal Component Analysis (PCA)</b> finds new axes, called <b>principal components</b>, that point along the directions where the data spreads out most.</p>
 <ol class="steps"><li><b>Standardise</b> each feature (subtract the mean, divide by the standard deviation) so large-scale features don\u2019t dominate.</li><li><b>Covariance matrix:</b> measure how every pair of features varies together.</li><li><b>Eigenvectors and eigenvalues</b> of that matrix: each eigenvector is a direction (a component); its eigenvalue says how much variance lies along it.</li><li><b>Keep the top k</b> components (largest eigenvalues) and project the data onto them.</li></ol>
 <div class="eq">PC1 = direction of greatest spread · PC2 = next greatest, at 90° to PC1 · …</div>
 <p>In the lab, raise the correlation between the two features. When they are strongly related, almost all the spread lies along PC1 — so one number can replace two with little loss.</p>`,lab:true},
 {h:"How many components?",b:`<p>Each component\u2019s share of the total variance is its <b>explained variance</b>:</p>
 <div class="eq">explained variance of PC<sub>i</sub> = λ<sub>i</sub> ÷ (λ<sub>1</sub> + λ<sub>2</sub> + … + λ<sub>n</sub>)</div>
 <div class="ex"><b>Worked example.</b> Eigenvalues 4.2, 1.1, 0.4, 0.3. Total = 6.0.<br>PC1 = 70%, PC2 = 18%, PC3 = 7%, PC4 = 5%. Keeping PC1 and PC2 keeps <b>88%</b> of the variance with half the features.</div>
 <p>A common rule: keep enough components to reach about 90–95% cumulative explained variance.</p>
 <p><b>Real uses:</b> compressing image features before a classifier, \u201ceigenfaces\u201d for face recognition, speeding up image retrieval, gene-expression analysis, and plotting high-dimensional data in 2D.</p>`}],
 terms:[["Feature","One measured property of an example."],["Covariance","How two features change together."],["Eigenvector","A direction that a matrix only stretches, never turns. In PCA: a principal component."],["Eigenvalue","How much the eigenvector is stretched. In PCA: the variance along that component."],["Explained variance","The share of total variance a component keeps."]],
 quiz:[{q:"Why do we standardise before PCA?",o:["To remove labels","So features measured on big scales don\u2019t dominate","To make the data 3D","It isn\u2019t needed"],a:1,why:"PCA follows variance. A feature in thousands would swamp one measured in decimals unless both are put on the same scale."},
 {q:"Dropping features that are almost constant is an example of…",o:["Feature extraction","A filter method of feature selection","PCA","Clustering"],a:1,why:"Low-variance filtering scores features one by one and keeps a subset of the originals."},
 {q:"Eigenvalues are 6, 3 and 1. What share does PC1 explain?",o:["6%","30%","60%","90%"],a:2,why:"6 ÷ (6 + 3 + 1) = 0.6 = 60%."},
 {q:"The principal components are…",o:["The original features, sorted","New directions that are combinations of the original features","Cluster centres","Class labels"],a:1,why:"PCA creates new axes (linear combinations of features) ordered by the variance they capture."}],
 recap:["High dimensions → slow, hard to see, prone to overfitting.","Selection keeps original features; extraction builds new ones.","PCA: standardise → covariance → eigenvectors/eigenvalues → keep top k.","Choose k with cumulative explained variance (≈90–95%)."]},

{n:3,part:1,title:"Object Detection with YOLO",short:"YOLO",slides:"Slides 3.1 YOLO",demo:"yolo",mins:40,
 goals:["Explain how detection differs from classification","Describe YOLO\u2019s grid and its output tensor","Compute IoU for two boxes","Explain what non-maximum suppression removes"],
 sections:[
 {h:"From \u201cwhat\u201d to \u201cwhat and where\u201d",b:`<p><b>Image classification</b> gives one label for a whole image (\u201cdog\u201d). <b>Object detection</b> finds <i>every</i> object, draws a <b>bounding box</b> around each and labels it (\u201cdog here, person there\u201d).</p>
 <p>Older detectors worked in two stages: first propose regions that might contain objects, then classify each region. <b>YOLO — You Only Look Once</b> — does it all in a <b>single pass</b> through one neural network, which makes it fast enough for real-time video.</p>
 <div class="tip"><b>Think of it like this:</b> instead of scanning a crowd person by person with a magnifying glass, YOLO glances at the whole scene once and calls out everything it sees.</div>`},
 {h:"The grid idea",b:`<p>YOLO divides the image into an <b>S × S grid</b>. The grid cell that contains the <b>centre</b> of an object is responsible for detecting it.</p>
 <p>Every cell predicts:</p>
 <ul><li><b>B bounding boxes</b>, each with 5 numbers: x, y (box centre, relative to the cell), w, h (width, height) and a <b>confidence score</b>.</li><li><b>C class probabilities</b> — how likely the object is a person, a car, a dog…</li></ul>
 <div class="eq">Output size = S × S × (5B + C)</div>
 <div class="ex"><b>Worked example (original YOLO).</b> S = 7, B = 2, C = 20 classes.<br>5 × 2 + 20 = 30 numbers per cell → output 7 × 7 × 30 = 1,470 numbers. The network\u2019s last layer produces 1,470 values, reshaped into this cube.</div>`,lab:true},
 {h:"Inside the network",b:`<ol class="steps"><li><b>Input:</b> the image is resized to 448 × 448 pixels.</li><li><b>Backbone CNN:</b> 24 convolutional layers and 4 max-pooling layers extract features. It mixes 1 × 1 convolutions (cheap, reduce channels) with 3 × 3 convolutions (capture spatial patterns).</li><li><b>Fully connected layers:</b> two of them turn features into the 1,470 predictions.</li><li><b>Activations:</b> Leaky ReLU inside the network (lets a small signal through for negative inputs, so neurons don\u2019t \u201cdie\u201d); a linear output at the end because boxes are raw numbers.</li><li><b>Regularisation:</b> dropout reduces overfitting. (Batch normalisation was added in YOLOv2.)</li></ol>
 <p>The backbone is first pre-trained on ImageNet classification, then trained for detection.</p>`},
 {h:"How YOLO learns: the loss",b:`<p>YOLO\u2019s loss adds up squared errors from three sources:</p>
 <ul><li><b>Localisation error</b> — how far the predicted box position and size are from the true box.</li><li><b>Confidence error</b> — the confidence should be high for boxes with an object and near zero for cells with none. Empty cells are down-weighted so they don\u2019t overwhelm the few cells that contain objects.</li><li><b>Classification error</b> — predicted class probabilities vs the true class.</li></ul>`},
 {h:"Confidence and IoU",b:`<p>How good is a predicted box? We compare it to the true box with <b>Intersection over Union</b>:</p>
 <div class="eq">IoU = area of overlap ÷ area of union</div>
 <div class="ex"><b>Worked example.</b> Two 10 × 10 boxes overlap in a 5 × 10 strip. Overlap = 50. Union = 100 + 100 − 50 = 150. IoU = 50 ÷ 150 = <b>0.33</b>.</div>
 <p>IoU is 1 for a perfect match and 0 for no overlap. A detection usually counts as correct if IoU ≥ 0.5.</p>
 <div class="eq">Box confidence = Pr(object) × IoU(predicted, true)<br>Class score = Pr(class | object) × box confidence</div>
 <p>Use the IoU tab in the lab to drag a box and watch the number change.</p>`},
 {h:"Cleaning up: non-maximum suppression",b:`<p>Several cells and boxes often fire on the same object, giving duplicates. <b>Non-maximum suppression (NMS)</b> cleans this up:</p>
 <ol class="steps"><li>Throw away boxes below a confidence threshold.</li><li>Take the most confident remaining box and keep it.</li><li>Delete every other box that overlaps it with IoU above a threshold (e.g. 0.5).</li><li>Repeat with the next most confident box.</li></ol>
 <p><b>After version 1:</b> later YOLOs added anchor boxes (v2), predictions at several scales for small objects (v3), and the newest versions predict boxes without anchors. The core idea — one fast pass — stays the same.</p>`}],
 terms:[["Bounding box","A rectangle (x, y, w, h) around an object."],["Grid cell","One square of the S × S grid; responsible for objects whose centre falls in it."],["IoU","Overlap ÷ union of two boxes."],["NMS","Removes duplicate boxes, keeping the most confident."],["Backbone","The CNN that extracts features before the prediction layers."]],
 quiz:[{q:"Which grid cell is responsible for an object?",o:["Every cell it touches","The cell containing the object\u2019s centre","The top-left cell","The cell with the brightest pixels"],a:1,why:"Only the cell holding the object\u2019s centre predicts it, which avoids double counting."},
 {q:"S = 13, B = 3, C = 80. Numbers per cell?",o:["83","95","240","1,040"],a:1,why:"5 × 3 + 80 = 95."},
 {q:"Two boxes: overlap 20, each box area 40. IoU?",o:["0.25","0.33","0.5","1"],a:1,why:"Union = 40 + 40 − 20 = 60. 20 ÷ 60 ≈ 0.33."},
 {q:"You lower the NMS IoU threshold from 0.7 to 0.3. What happens?",o:["More duplicate boxes survive","More boxes are removed","Confidence scores rise","Nothing"],a:1,why:"A lower threshold means even small overlaps count as duplicates, so more boxes get suppressed."}],
 recap:["Detection = what + where. YOLO does it in one network pass.","S × S grid; each cell predicts B boxes and C class probabilities → S × S × (5B + C).","IoU measures box overlap; confidence = Pr(object) × IoU.","NMS keeps the best box and removes overlapping duplicates."]},

{n:4,part:1,title:"Vision Transformers",short:"Vision transformers",slides:"Slides 4.1 ViT Architecture · 4.2 CNN vs ViT and Swin",demo:"vit",mins:40,
 goals:["Turn an image into a sequence of patch tokens","Explain positional embeddings and the CLS token","Describe self-attention with queries, keys and values","Compare CNNs, ViT and Swin"],
 sections:[
 {h:"A quick look back at CNNs",b:`<p><b>Convolutional neural networks (CNNs)</b> slide small filters across an image. Each filter looks at a small neighbourhood, and layers stack up from edges → textures → parts → objects. Pooling shrinks the image as we go deeper.</p>
 <p>This builds in two helpful assumptions: nearby pixels matter most (<i>locality</i>), and a pattern means the same thing anywhere in the image. The downside: a filter only sees far-apart regions after many layers.</p>`},
 {h:"Images as sentences",b:`<p>Transformers were invented for text, where a sentence is a sequence of word <b>tokens</b>. The <b>Vision Transformer (ViT)</b> makes an image look like a sentence:</p>
 <ol class="steps"><li><b>Patchify:</b> cut the image into equal, non-overlapping squares (patches), e.g. 16 × 16 pixels.</li><li><b>Flatten and embed:</b> turn each patch into a vector and multiply by a learned matrix to get a <i>patch embedding</i> of size D. (This is the same as a convolution whose kernel size and stride equal the patch size.)</li></ol>
 <div class="eq">Number of patches N = (H × W) ÷ P²</div>
 <div class="ex"><b>Worked example.</b> A 224 × 224 image with 16 × 16 patches: 224 ÷ 16 = 14, so 14 × 14 = <b>196</b> patches. Each patch holds 16 × 16 × 3 = 768 pixel values.</div>`,lab:true},
 {h:"Position and the CLS token",b:`<p>Attention on its own has no sense of order — shuffle the patches and it would give the same answer. So ViT adds a learned <b>positional embedding</b> to each patch to say where it came from.</p>
 <p>ViT also puts one extra learnable token at the front: the <b>CLS (classification) token</b>. It has no pixels of its own; during training it learns to gather information from all the patches. Its final value is what the classifier uses. With 196 patches, the sequence has <b>197</b> tokens.</p>`},
 {h:"Self-attention",b:`<p>Inside each encoder block, every token looks at every other token and decides how much to borrow from each. Each token is turned into three vectors:</p>
 <ul><li><b>Query (Q)</b> — what am I looking for?</li><li><b>Key (K)</b> — what do I contain?</li><li><b>Value (V)</b> — what will I pass on?</li></ul>
 <div class="eq">Q = XW<sub>Q</sub>, K = XW<sub>K</sub>, V = XW<sub>V</sub><br>Attention(Q, K, V) = softmax( QK<sup>T</sup> ÷ √d ) · V</div>
 <p>Q·K gives a match score for every pair of tokens; softmax turns scores into weights that add up to 1; the output is a weighted mix of the values. Dividing by √d keeps the scores from getting too large.</p>
 <p><b>Multi-head attention</b> runs several attentions in parallel, each free to focus on something different (colour, shape, position), then joins them. Click a patch in the lab to see one row of attention weights.</p>`},
 {h:"The encoder block",b:`<p>ViT stacks many identical blocks (12 in ViT-Base). Each block has:</p>
 <ol class="steps"><li><b>LayerNorm</b> — rescales each token\u2019s values to a steady range. ViT applies it <i>before</i> each sub-layer (\u201cpre-norm\u201d), which keeps training stable.</li><li><b>Multi-head self-attention.</b></li><li><b>Residual connection</b> — adds the block\u2019s input back to its output, so information and gradients can skip ahead.</li><li><b>Feed-forward network</b> — two dense layers with a GELU activation, applied to each token separately.</li><li>Another residual connection.</li></ol>
 <p>At the end, the CLS token goes through a small <b>MLP head</b> that outputs class probabilities.</p>`},
 {h:"CNN vs ViT vs Swin",b:`<table class="tbl"><tr><th></th><th>CNN</th><th>ViT</th><th>Swin Transformer</th></tr>
 <tr><td>Looks at</td><td>Small local windows</td><td>All patches at once (global)</td><td>Local windows that shift each layer</td></tr>
 <tr><td>Built-in assumptions</td><td>Strong (locality)</td><td>Few — learns from data</td><td>Some locality, plus hierarchy</td></tr>
 <tr><td>Data needed</td><td>Works with less</td><td>Needs lots, or pre-training</td><td>In between</td></tr>
 <tr><td>Cost as image grows</td><td>Grows with image size</td><td>Grows with N² (every pair)</td><td>Grows with image size</td></tr></table>
 <p><b>Swin</b> (Shifted Window) computes attention only inside small windows, then shifts the window grid in the next layer so neighbouring windows can share information. It also merges patches as it goes deeper, building a pyramid like a CNN — handy for detection and segmentation on large images. Tick \u201cSwin-style local windows\u201d in the lab to compare the number of attention pairs.</p>`}],
 terms:[["Patch","A small square cut from the image; becomes one token."],["Token","One element of the input sequence."],["Positional embedding","A learned vector that tells the model where a patch was."],["CLS token","An extra token whose final value is used for classification."],["Self-attention","Each token builds its output as a weighted mix of all tokens."]],
 quiz:[{q:"A 256 × 256 image with 32 × 32 patches gives how many patch tokens?",o:["8","32","64","256"],a:2,why:"256 ÷ 32 = 8, and 8 × 8 = 64."},
 {q:"Why does ViT need positional embeddings?",o:["To save memory","Attention alone ignores order, so it wouldn\u2019t know where patches are","To add colour","To replace the CLS token"],a:1,why:"Without them, shuffling the patches would give the same result."},
 {q:"In attention, what does softmax do to the Q·K scores?",o:["Makes them into weights that sum to 1","Sorts them","Removes negatives only","Multiplies them by V"],a:0,why:"Softmax turns raw scores into a probability-like set of weights."},
 {q:"Why is Swin better suited than plain ViT to very large images?",o:["It uses no attention","It attends within local windows, so cost doesn\u2019t explode with N²","It has no patches","It is a CNN"],a:1,why:"Windowed attention keeps the number of token pairs manageable."}],
 recap:["ViT = patches → embeddings + position + CLS → transformer encoder → MLP head.","Attention = softmax(QKᵀ/√d)·V; multi-head runs several in parallel.","CNNs build in locality; ViTs learn relationships from data and need more of it.","Swin uses shifted local windows and a hierarchy to scale up."]},

{n:5,part:2,title:"Generative Models: GANs & VAEs",short:"GANs & VAEs",slides:"Slides 5.1 GANs and Variational Autoencoders",demo:"gen",mins:40,
 goals:["Explain the generator vs discriminator game","Walk through one round of GAN training","Describe the VAE encoder, latent space and decoder","Explain the reparameterisation trick and the two parts of the VAE loss"],
 sections:[
 {h:"What does \u201cgenerative\u201d mean?",b:`<p>Most models so far were <b>discriminative</b>: given an image, predict a label. A <b>generative</b> model learns what the data itself looks like, so it can create <i>new</i> examples — new faces, new handwriting, new textures — that resemble the training data.</p>
 <p>Uses: image synthesis, data augmentation (making extra training examples), filling in missing parts of images, anomaly detection (things the model finds unlikely), and creative tools.</p>`},
 {h:"GANs: a forger and a detective",b:`<p>A <b>Generative Adversarial Network</b> has two networks that compete:</p>
 <ul><li>The <b>generator (G)</b> takes random noise and turns it into a fake sample.</li><li>The <b>discriminator (D)</b> looks at a sample and outputs the probability that it is real.</li></ul>
 <div class="tip"><b>Think of it like this:</b> G is an art forger and D is a detective. Each time the detective catches a fake, the forger improves. Each time a fake slips through, the detective sharpens up. Eventually the fakes are so good the detective can only guess — D(x) ≈ 0.5.</div>`},
 {h:"One round of GAN training",b:`<p><b>Step 1 — train the discriminator.</b></p>
 <ol class="steps"><li>G makes a batch of fakes from noise.</li><li>D sees real images (target label 1) and fakes (target label 0).</li><li>Compute D\u2019s loss (how wrong its probabilities were) and backpropagate to update <b>only D</b>.</li></ol>
 <p><b>Step 2 — train the generator.</b></p>
 <ol class="steps"><li>G makes new fakes; D scores them.</li><li>G\u2019s loss compares D\u2019s scores to the label G wants: 1, \u201creal\u201d.</li><li>Backpropagate through D into G and update <b>only G</b>.</li></ol>
 <p>Repeat for many rounds. GANs can be unstable: if D wins too easily G gets no useful signal, and G may learn to produce only a few kinds of output (<i>mode collapse</i>). The lab trains a tiny 1-D GAN live so you can watch the two sides settle.</p>`,lab:true},
 {h:"Autoencoders and VAEs",b:`<p>An <b>autoencoder</b> squeezes an input through a small middle layer and rebuilds it:</p>
 <ul><li><b>Encoder:</b> compresses the input into a short code in the <b>latent space</b>.</li><li><b>Decoder:</b> rebuilds the input from that code.</li></ul>
 <p>A plain autoencoder maps each input to one exact point, which leaves gaps: decode a random point and you may get nonsense. A <b>Variational Autoencoder (VAE)</b> fixes this. Its encoder outputs a <b>mean μ</b> and a <b>spread σ</b> — a small cloud rather than a point — and we <b>sample</b> a code z from that cloud.</p>
 <div class="eq">z = μ + σ · ε, where ε is random noise from N(0, 1)</div>
 <p>This is the <b>reparameterisation trick</b>. The randomness lives in ε, so we can still backpropagate through μ and σ.</p>`},
 {h:"The VAE loss",b:`<div class="eq">VAE loss = reconstruction loss + KL divergence</div>
 <ul><li><b>Reconstruction loss:</b> how different the output is from the input. Keeps outputs faithful.</li><li><b>KL divergence:</b> how far each encoded cloud is from a standard normal N(0, 1). Keeps the latent space smooth and filled in, with no gaps.</li></ul>
 <p>Because the latent space is smooth, nearby codes decode to similar outputs, and walking between two codes morphs one output into another. To <b>generate</b> something new, sample z from N(0, 1) and run the decoder. Try the VAE tab in the lab.</p>
 <table class="tbl"><tr><th></th><th>GAN</th><th>VAE</th></tr><tr><td>Training</td><td>Two networks compete</td><td>One encoder–decoder with a loss</td></tr><tr><td>Output quality</td><td>Very sharp</td><td>Often a little blurry</td></tr><tr><td>Stability</td><td>Can be tricky</td><td>Stable</td></tr><tr><td>Latent space</td><td>No encoder by default</td><td>Smooth, easy to explore</td></tr></table>
 <p><b>Going further:</b> today\u2019s leading image generators are <b>diffusion models</b>. They learn to remove noise step by step, starting from pure noise and gradually revealing an image.</p>`}],
 terms:[["Generator","Turns random noise into a synthetic sample."],["Discriminator","Scores how likely a sample is to be real."],["Latent space","The compressed space of codes a model uses internally."],["Reparameterisation trick","Writing z = μ + σ·ε so sampling stays trainable."],["KL divergence","Measures how different two probability distributions are."]],
 quiz:[{q:"When training the discriminator, fake images are labelled…",o:["1","0","0.5","They are not used"],a:1,why:"D learns real = 1, fake = 0."},
 {q:"When the GAN is well trained, D(fake) is close to…",o:["0","0.5","1","It varies wildly"],a:1,why:"D can no longer tell the difference, so it guesses."},
 {q:"What does the KL term in the VAE loss do?",o:["Makes images sharper","Keeps the latent space close to N(0, 1) so it is smooth","Trains the discriminator","Counts pixels"],a:1,why:"It stops the encoder from scattering codes far apart, leaving no gaps."},
 {q:"To generate a brand-new sample from a trained VAE you…",o:["Run the encoder only","Sample z from N(0, 1) and run the decoder","Run the discriminator","Average two training images"],a:1,why:"The decoder turns any latent code into an output."}],
 recap:["Generative models learn the data itself so they can create new samples.","GAN: generator vs discriminator; alternate training; aim for D ≈ 0.5.","VAE: encoder → (μ, σ) → z = μ + σε → decoder.","VAE loss = reconstruction + KL. Diffusion models are today\u2019s state of the art."]},

{n:6,part:2,title:"Large Language Models & Generative AI",short:"LLMs & GenAI",slides:"Slides 6.1 Large Language Models · 6.2 How Generative AI Works",demo:"llm",mins:40,
 goals:["Trace text from tokens to a next-token prediction","Explain self-attention in a sentence","Describe pre-training, fine-tuning and RLHF","Use temperature, the context window and RAG correctly"],
 sections:[
 {h:"What is an LLM?",b:`<p>A <b>large language model</b> is a very large transformer trained on huge amounts of text. At its core it does one thing: <b>predict the next token</b>. Repeat that prediction over and over and you get paragraphs, code, answers and conversations.</p>
 <p>The transformer is the same architecture you met in Module 4 — words instead of image patches.</p>`},
 {h:"From text to prediction",b:`<ol class="steps"><li><b>Tokenisation:</b> text is split into tokens — words, pieces of words, or characters. \u201cunbelievable\u201d might become \u201cun\u201d, \u201cbeliev\u201d, \u201cable\u201d.</li><li><b>Embeddings:</b> each token becomes a vector of numbers. Words used in similar ways end up with similar vectors.</li><li><b>Self-attention layers:</b> each token looks at the other tokens to understand context.</li><li><b>Output:</b> a probability for every token in the vocabulary as the next one.</li></ol>
 <p>In self-attention, each token makes a <b>query</b> (what it is looking for), a <b>key</b> (what it offers) and a <b>value</b> (the information it passes on). Query–key matches decide how much of each value flows into the token\u2019s new meaning. In \u201cThe robot picked up the ball because <i>it</i> was light\u201d, attention helps \u201cit\u201d connect to \u201cball\u201d. In text generators each token only attends to earlier tokens.</p>`,lab:true},
 {h:"How LLMs are trained",b:`<p><b>Pre-training</b> is <b>self-supervised</b>: the training text supplies its own answers, because the \u201clabel\u201d is simply the next word. The model predicts, compares with the real next token, and adjusts its weights by gradient descent, billions of times.</p>
 <p>Then the model is shaped for real use:</p>
 <ul><li><b>Supervised fine-tuning:</b> train on example prompts paired with good answers.</li><li><b>Instruction tuning:</b> fine-tuning on many tasks written as instructions, so it follows directions.</li><li><b>RLHF (reinforcement learning from human feedback):</b> people rank answers; a reward model learns their preferences; the LLM is tuned to score well.</li><li><b>Reasoning models:</b> further reinforcement learning that rewards breaking hard problems into steps.</li></ul>`},
 {h:"Using an LLM well",b:`<p><b>Sampling and temperature.</b> The model gives probabilities; we pick a token from them. <b>Temperature</b> controls how adventurous the pick is:</p>
 <div class="eq">p(token) = softmax(logit ÷ T)</div>
 <p>Low T (e.g. 0.2) → almost always the top token: focused, repeatable. High T (e.g. 1.5) → more variety, more risk. <b>Top-k</b> only allows the k most likely tokens. Try both in the sampling tab.</p>
 <p><b>Prompt engineering:</b> clear instructions, context and examples get better answers.</p>
 <p><b>Context window:</b> the maximum number of tokens the model can read at once — your prompt plus its answer. Anything outside it is not seen.</p>
 <p><b>Retrieval-augmented generation (RAG):</b> search a document collection for passages relevant to the question and place them in the context window, so the model answers from up-to-date or private information without retraining.</p>`},
 {h:"Generative AI, the big picture",b:`<p>Generative AI starts from a <b>foundation model</b> — a large model trained on broad data (LLMs are the best-known kind; image and multimodal models are others). Building an application usually has three phases:</p>
 <ol class="steps"><li><b>Training</b> the foundation model.</li><li><b>Tuning</b> it for a specific job (fine-tuning, RLHF, or just good prompts and RAG).</li><li><b>Generation, evaluation and improvement</b> — checking outputs for accuracy and quality and refining over time.</li></ol>
 <p><b>Multimodal models</b> accept images as well as text by turning image patches into tokens, exactly as ViT does. That is how a model can describe a video frame.</p>
 <p><b>Be careful:</b> LLMs can state wrong things confidently (<i>hallucination</i>). Check important claims, especially in high-stakes settings.</p>`}],
 terms:[["Token","A unit of text the model reads — a word, sub-word or character."],["Embedding","A vector of numbers representing a token\u2019s meaning."],["Temperature","Controls how random the next-token choice is."],["Context window","How many tokens the model can see at once."],["RAG","Retrieving documents into the prompt so the model can use them."]],
 quiz:[{q:"What is an LLM fundamentally trained to do?",o:["Classify images","Predict the next token","Cluster documents","Translate only"],a:1,why:"Next-token prediction on huge text corpora is the core pre-training task."},
 {q:"You want the same, focused answer every time. Temperature should be…",o:["Low","High","Exactly 2","It doesn\u2019t matter"],a:0,why:"Low temperature sharpens probabilities towards the top token."},
