{n:13,part:3,title:"Object Tracking",short:"Tracking",slides:"Slides 13.1 Tracking",demo:"tracking",mins:40,
 goals:["Explain how tracking differs from detection","Describe the Kalman filter\u2019s predict–update cycle","Use a cost matrix and the Hungarian algorithm to match tracks","Explain how occlusion breaks tracking and how re-identification helps"],
 sections:[
 {h:"Detection vs tracking",b:`<p><b>Object detection</b> looks at one frame and says what objects are there and where. <b>Object tracking</b> follows those objects <i>across frames</i> and keeps a consistent <b>identity (ID)</b> for each: \u201cperson 3 walked from here to there\u201d.</p>
 <p>Most modern systems use <b>tracking-by-detection</b>:</p>
 <ol class="steps"><li>Run a detector (e.g. YOLO) on each frame.</li><li><b>Predict</b> where each existing track should be now.</li><li><b>Associate</b> new detections with existing tracks.</li><li><b>Update</b> matched tracks, start new tracks for unmatched detections, and retire tracks that have been lost too long.</li></ol>`},
 {h:"The Kalman filter: predict, then update",b:`<p>Detections are noisy and sometimes missing. The <b>Kalman filter</b> keeps a smooth estimate of each object\u2019s position and velocity.</p>
 <ul><li><b>Predict:</b> use the previous position and velocity to guess where the object is now. Uncertainty grows, because time has passed.</li><li><b>Update:</b> when a new detection arrives, blend it with the prediction. Uncertainty shrinks.</li></ul>
 <div class="eq">new estimate = prediction + K × (measurement − prediction)<br>K = prediction uncertainty ÷ (prediction uncertainty + measurement uncertainty)</div>
 <p>K is the <b>Kalman gain</b>. If the detector is noisy, K is small and we trust the prediction; if the prediction is shaky, K is large and we trust the measurement.</p>
 <div class="ex"><b>Worked example.</b> Prediction x = 100 (uncertainty 4); detection x = 110 (uncertainty 1). K = 4 ÷ (4 + 1) = 0.8. New estimate = 100 + 0.8 × 10 = <b>108</b> — closer to the more trusted detection.</div>
 <p>Why both steps? Prediction alone drifts; measurements alone jitter and vanish when the object is hidden. Together they are smooth and robust.</p>`,lab:true},
 {h:"Matching: the Hungarian algorithm",b:`<p>With several tracks and several detections, which detection belongs to which track? Build a <b>cost matrix</b> — rows are tracks, columns are detections, and each cost says how unlikely that pairing is. Costs come from:</p>
 <ul><li>distance between the Kalman prediction and the detection,</li><li>1 − IoU of their boxes,</li><li>appearance difference (colour or a learned embedding).</li></ul>
 <p>The <b>Hungarian algorithm</b> finds the one-to-one assignment with the <b>lowest total cost</b>. It is better than greedily taking the cheapest pair first, which can force a bad match later. <b>Gating</b> first removes impossible pairs (too far away).</p>
 <p><b>When it breaks:</b> the algorithm always returns the cheapest answer, even if it is wrong. When two people look alike and stand close together, costs are nearly equal and a small change can swap their IDs — an <b>ID switch</b>. Missing or false detections also cause errors.</p>`},
 {h:"Occlusion and re-identification",b:`<p><b>Occlusion</b> happens when a tracked object is partly or fully hidden — behind a pillar, a car, or another person.</p>
 <ul><li>The detector produces no box, so the track loses its measurements.</li><li>People crossing paths can get their IDs swapped.</li><li>When the object reappears it may get a brand-new ID.</li></ul>
 <p>Handling a long occlusion (say, 5 seconds):</p>
 <ol class="steps"><li>Keep the track in a <b>lost</b> state instead of deleting it.</li><li>Let the Kalman filter keep predicting its path (with growing uncertainty).</li><li>When a new detection appears, check it is in a plausible place (gating).</li><li>Compare its <b>appearance embedding</b> from a re-identification network (e.g. OSNet) with the stored one.</li><li>Match with the Hungarian algorithm; restore the old ID only if the evidence is strong — in forensic work, a wrong identity is worse than an unresolved one.</li></ol>`}],
 terms:[["Tracking-by-detection","Detect every frame, then link detections into tracks."],["Kalman filter","Predict–update estimator for position and velocity."],["Kalman gain","How much to trust the measurement over the prediction."],["Hungarian algorithm","Finds the lowest-cost one-to-one assignment."],["Occlusion","When a tracked object is hidden from view."]],
 quiz:[{q:"What does tracking add to detection?",o:["Colour","Consistent identities over time","Higher resolution","Labels"],a:1,why:"Tracking links detections across frames with the same ID."},
 {q:"Prediction 50 (uncertainty 1), measurement 60 (uncertainty 1). Kalman estimate?",o:["50","55","60","110"],a:1,why:"K = 1 ÷ 2 = 0.5, so 50 + 0.5 × 10 = 55."},
 {q:"During a full occlusion, what keeps the track alive?",o:["The detector","The Kalman prediction","Non-max suppression","Histogram equalization"],a:1,why:"No detections arrive, so the filter keeps predicting."},
 {q:"Two similar people walk side by side. What risk rises?",o:["Overfitting","ID switches","False contouring","Aliasing"],a:1,why:"Near-equal costs make the assignment easy to flip."}],
 recap:["Detection = where now; tracking = who, over time.","Kalman: predict (uncertainty grows) → update (uncertainty shrinks).","Cost matrix + Hungarian = best one-to-one match.","Occlusion: keep lost tracks, predict, then re-identify with appearance."]},

{n:14,part:3,title:"Case Study: AI Models Analysing Video Evidence",short:"Case study",slides:"Slides 14.2 Research Spotlight",demo:"study",mins:25,
 goals:["See how the course ideas combine in a real study","Explain what a multimodal LLM is","Compare prompting strategies","Read results with accuracy, precision, recall and F1"],
 sections:[
 {h:"The question",b:`<p><b>Multimodal large language models (MLLMs)</b> can take images as well as text — they turn image patches into tokens, much like a Vision Transformer. Could they help analyse crime-scene video the way a forensic expert would?</p>
 <p>Research by your instructor, Opeyemi Adeniran, asked three questions:</p>
 <ol class="steps"><li>How closely can MLLMs approximate human forensic reasoning?</li><li>Which <b>prompting techniques</b> give the most reliable, human-aligned outputs?</li><li>How do differences between models change how well prompting works?</li></ol>`},
 {h:"How the study worked",b:`<ul><li><b>Data:</b> 5,714 frames from the UCF-Crime video dataset, covering 11 crime categories.</li><li><b>Pipeline:</b> load frames → encode them → send 10 frames at a time to each model → receive a structured (JSON) answer.</li><li><b>Models:</b> GPT-4o, Claude Sonnet 4 and Gemini 2.0 Flash.</li><li><b>Evaluation:</b> a 10-question forensic rubric — crime type and intent, timeline, people and behaviour, physical evidence, violence and weapons, coordination, method, scene context, escape route, and whether the narrative is court-ready.</li></ul>
 <p><b>Eight prompting strategies</b> were compared:</p>
 <table class="tbl"><tr><th>Strategy</th><th>How it asks</th></tr>
 <tr><td>Zero-shot</td><td>Direct instruction, no examples</td></tr><tr><td>Sequential</td><td>Five stages from scene overview to detailed timeline</td></tr><tr><td>Least-to-most</td><td>Eight levels from simple objects to complex activity</td></tr><tr><td>ReAct</td><td>A think → act → observe → decide cycle</td></tr><tr><td>Iterative</td><td>Four rounds: people, actions, criminal elements, critical review</td></tr><tr><td>Meta-prompting</td><td>The model writes its own specialised prompts</td></tr><tr><td>Self-consistency</td><td>Five independent analyses, then a consensus</td></tr><tr><td>Chain-of-thought</td><td>Six reasoning steps from observation to interpretation</td></tr></table>`},
 {h:"What they found",b:`<p>Results were scored with the metrics from Module 11 — accuracy, precision, recall and F1 — plus how consistently the models agreed.</p>
 <ul><li><b>GPT-4o</b> came closest to human forensic reasoning (F1 0.686, accuracy 0.580), then Gemini (F1 0.456) and Claude (F1 0.365).</li><li><b>ReAct</b> was the most reliable prompting technique across all three models (100%, 90.9% and 81.8% consistency).</li><li>GPT-4o stayed stable whatever the prompt; Claude\u2019s results varied most between techniques.</li></ul>
 <p>Explore the numbers in the lab. Notice how a model can have high recall but lower precision — the same trade-off you saw with the decision threshold.</p>`,lab:true},
 {h:"Why it matters, and what\u2019s next",b:`<p>The study connects much of this course: images as data (Modules 1–3), deep vision models and transformers (Module 12), evaluation metrics (Module 11) and careful reasoning about identity and events (Module 13).</p>
 <p><b>Take-aways:</b> how you ask matters as much as which model you use, and results must be measured, not assumed — especially when the stakes are legal.</p>
 <p><b>Future work:</b> more crime categories, combining several prompting strategies (ensembles), and making sensitive models more consistent.</p>`}],
 terms:[["Multimodal LLM","A language model that also accepts images or video."],["Prompting strategy","A structured way of asking a model to reason."],["ReAct","Prompting that cycles through thinking, acting, observing and deciding."],["UCF-Crime","A public video dataset of real-world crime and normal events."],["Rubric","A fixed set of criteria for scoring answers."]],
 quiz:[{q:"How does a multimodal LLM read an image?",o:["As one number","By turning image patches into tokens","It cannot","By converting it to audio"],a:1,why:"Like ViT, it splits images into patches and embeds them as tokens."},
 {q:"Which prompting technique was most reliable across models in the study?",o:["Zero-shot","Meta-prompting","ReAct","Self-consistency"],a:2,why:"ReAct had the highest consistency for all three models."},
 {q:"GPT-4o had precision 0.645 and recall 0.793. What does that mean?",o:["It raised few false alarms but missed many real cases","It found most real cases, but about a third of its positive calls were wrong","It was correct 79% of the time overall","Its F1 must be above 0.9"],a:1,why:"Recall 0.79 = found most real cases; precision 0.65 = roughly 1 in 3 positive calls was a false alarm."},
 {q:"Why use several metrics instead of accuracy alone?",o:["It looks better","Accuracy can hide missed cases or false alarms","Accuracy is always wrong","Metrics are optional"],a:1,why:"Precision and recall show what kind of mistakes are being made."}],
 recap:["MLLMs see images as patch tokens, like ViT.","Eight prompting strategies × three models × 5,714 frames.","GPT-4o most human-aligned; ReAct most reliable.","Measure with precision, recall and F1 — especially in high-stakes settings."]}
];

function sceneCanvas(w,h){

  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,"#1c6ea4");g.addColorStop(1,"#f2b36b");x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle="#2e4d2c";x.beginPath();x.moveTo(0,h*.78);for(let i=0;i<=w;i+=w/8){x.lineTo(i,h*.72+Math.sin(i/w*9)*h*.05)}x.lineTo(w,h);x.lineTo(0,h);x.fill();
  x.fillStyle="#fff3c4";x.beginPath();x.arc(w*.76,h*.26,h*.13,0,7);x.fill();
  x.fillStyle="#c0392b";x.fillRect(w*.12,h*.42,w*.22,h*.34);
  x.fillStyle="#3b2a20";x.beginPath();x.moveTo(w*.09,h*.44);x.lineTo(w*.23,h*.24);x.lineTo(w*.37,h*.44);x.fill();
  x.fillStyle="#f7d154";x.fillRect(w*.19,h*.52,w*.07,h*.1);
  x.fillStyle="#111";x.fillRect(w*.5,h*.46,w*.035,h*.3);x.fillStyle="#1f8a4c";x.beginPath();x.arc(w*.517,h*.42,h*.12,0,7);x.fill();
  x.fillStyle="#ffffff";x.font=`bold ${Math.round(h*.13)}px Arial`;x.fillText("CV",w*.62,h*.9);

}
function grayScene(w,h){
  const key=w+"x"+h;if(SCN[key])return SCN[key];
  const c=sceneCanvas(w,h),d=c.getContext("2d").getImageData(0,0,w,h).data,g=new Float32Array(w*h);
  let sd=12345;const rn=()=>{sd=(sd*16807)%2147483647;return sd/2147483647-.5};for(let i=0;i<w*h;i++)g[i]=clamp(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]+rn()*10,0,255);
  return SCN[key]={w,h,d:g};
}
function drawGray(cv,img,scale=1){

function conv(img,K,k){
  const{w,h,d}=img,o=new Float32Array(w*h),r=k>>1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const yy=clamp(y+j,0,h-1),xx=clamp(x+i,0,w-1);s+=d[yy*w+xx]*K[(j+r)*k+(i+r)]}o[y*w+x]=s}
  return{w,h,d:o};
}

/* 2. sampling & quantization */
DEMOS.sampling=(root)=>{
  const img=grayScene(320,200);let blk=1,bits=8;const cv=el("canvas");const cap=el("figcaption");
  function run(){const{w,h,d}=img,o=new Float32Array(w*h),L=2**bits;
    for(let y=0;y<h;y+=blk)for(let x=0;x<w;x+=blk){let s=0,n=0;for(let j=0;j<blk&&y+j<h;j++)for(let i=0;i<blk&&x+i<w;i++){s+=d[(y+j)*w+x+i];n++}
      let v=s/n;v=Math.floor(v/256*L);v=L===1?0:v*255/(L-1);for(let j=0;j<blk&&y+j<h;j++)for(let i=0;i<blk&&x+i<w;i++)o[(y+j)*w+x+i]=v}
    drawGray(cv,{w,h,d:o});cv.style.width="100%";
    cap.textContent=`${Math.ceil(w/blk)}×${Math.ceil(h/blk)} samples · ${L} grey level${L>1?"s":""} (${bits}-bit) · ≈${Math.ceil(Math.ceil(w/blk)*Math.ceil(h/blk)*bits/8/1024*10)/10} KB`}
  root.append(el("div",{class:"ctrls"},

    slider("Quantization: bits per pixel",1,8,1,bits,v=>v+" bit",v=>{bits=v;run()})),
    el("figure",{},cv,cap),el("p",{class:"note"},"Big blocks = under-sampling (blocky). Few bits = false contouring (bands in the sky gradient)."));run();
};
